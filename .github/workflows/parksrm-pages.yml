name: ParkSRM web deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: parksrm-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Expand starter source bundle on first run
        id: bootstrap
        shell: bash
        run: |
          if [ -f ParkSRM.payload.00 ]; then
            cat ParkSRM.payload.00 ParkSRM.payload.01 ParkSRM.payload.02 ParkSRM.payload.03 ParkSRM.payload.04 ParkSRM.payload.05 > /tmp/ParkSRM-source.b64
            head -c 6500 ParkSRM.payload.06 >> /tmp/ParkSRM-source.b64
            cat ParkSRM.payload.07 >> /tmp/ParkSRM-source.b64

            actual="$(wc -c < /tmp/ParkSRM-source.b64 | tr -d ' ')"
            test "$actual" = "48512"
            base64 --decode /tmp/ParkSRM-source.b64 > /tmp/ParkSRM-source.zip
            unzip -t /tmp/ParkSRM-source.zip
            mkdir -p /tmp/ParkSRM-unpacked
            unzip -q /tmp/ParkSRM-source.zip -d /tmp/ParkSRM-unpacked
            rsync -a --exclude='.github' /tmp/ParkSRM-unpacked/ParkSRM/ ./
            rm -f ParkSRM.payload.*
            echo "expanded=true" >> "$GITHUB_OUTPUT"
          else
            echo "expanded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit expanded project files
        if: steps.bootstrap.outputs.expanded == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand ParkSRM starter source"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
